<script type="text/x-dc" data-dc-script data-props='{"nightMode":{"editor":"enum","options":["auto","on","off"],"default":"auto"},"sky":{"editor":"enum","options":["auto","dawn","day","sunset","night","rain"],"default":"auto"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { now: new Date(), focus: 0, pickIndex: 0, spinUntil: Date.now() + 20000, jazz: false, glow: true, rot: 0 };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ now: new Date() }), 1000);

  componentWillUnmount() {
    clearInterval(this.timer);
    clearInterval(this.rotTimer);
  }
  renderVals() {
    const now = this.state.now;
    const m = now.getMinutes() + now.getSeconds() / 60;
    const h = (now.getHours() % 12) + m / 60;
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const mode = this.props.nightMode ?? 'auto';
    const night = mode === 'on' || (mode === 'auto' && (nowMin >= 17 * 60 + 41 + 45 || nowMin < 6 * 60 + 58));
    const jazz = this.state.jazz;
    const sunriseMin = 6 * 60 + 58, sunsetMin = 17 * 60 + 41;
    const skyMode = this.props.sky ?? 'auto';
    const phase = skyMode !== 'auto' ? skyMode : ((nowMin < sunriseMin - 30 || nowMin >= sunsetMin + 45) ? 'night' : (nowMin < sunriseMin + 60 ? 'dawn' : (nowMin >= sunsetMin - 60 ? 'sunset' : 'day')));
    const skies = {
      dawn: ['rgba(248, 170, 205, 0.60)', 'rgba(255, 214, 120, 0.45)'],
      day: ['rgba(190, 160, 240, 0.55)', 'rgba(248, 170, 205, 0.50)'],
      sunset: ['rgba(255, 170, 110, 0.60)', 'rgba(248, 140, 190, 0.50)'],
      night: ['rgba(120, 100, 200, 0.55)', 'rgba(90, 140, 220, 0.40)'],
      rain: ['rgba(170, 185, 210, 0.55)', 'rgba(200, 190, 230, 0.40)']
    };
    const jazzSky = ['rgba(255, 140, 60, 0.42)', 'rgba(214, 64, 32, 0.28)'];
    const sk = jazz ? jazzSky : skies[phase];
    const playlists = Array.from({ length: 12 }, (_, i) => '[Jazz playlist ' + (i + 1) + ']');
    const pages = Math.ceil(playlists.length / 3);
    const picks = [
      { title: '[Record]', artist: '[Artist] · [Year]' },
      { title: '[Another record]', artist: '[Artist] · [Year]' },
      { title: '[Third record]', artist: '[Artist] · [Year]' }
    ];
    const names = ['Spotify', 'Netflix', 'YouTube', 'Prime Video', 'Disney+', 'Plex'];
    const tile = 'aspect-ratio: 16 / 9; border-radius: 16px; border: 1px solid rgba(46, 31, 74, 0.08); background: rgba(62, 38, 20, 0.85); color: #2E1F4A; font-family: inherit; font-size: 19px; font-weight: 700; box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);';
    const tileOn = 'aspect-ratio: 16 / 9; border-radius: 16px; border: none; background: #5A3820; color: #2E1F4A; font-family: inherit; font-size: 19px; font-weight: 700; outline: 4px solid #D9458F; outline-offset: 4px; box-shadow: 0 0 40px rgba(217, 69, 143, 0.45), 0 20px 40px rgba(0, 0, 0, 0.45); transform: scale(1.08);';
    const spinning = Date.now() < this.state.spinUntil;
    const hh = now.getHours() % 12 || 12;
    const mm = String(now.getMinutes()).padStart(2, '0');
    return {
      nightFilter: night ? 'filter: brightness(0.75) sepia(0.08);' : '',
      bg: jazz ? '#160504' : '#CFE6F5',
      glowA: sk[0], glowB: sk[1],
      jazz, normal: !jazz,
      toggleJazz: () => this.setState({ jazz: !jazz, pickIndex: this.state.pickIndex + 1, spinUntil: Date.now() + 20000 }),
      glowOn: this.state.glow,
      toggleGlow: () => this.setState({ glow: !this.state.glow }),
      glowStyle: jazz && this.state.glow ? 'animation: beatGlow 0.8s ease-in-out infinite;' : '',
      glowBtn: 'height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid ' + (this.state.glow ? '#FF8C3C' : '#5A2117') + '; background: transparent; color: ' + (this.state.glow ? '#FFB27A' : '#C98B74') + '; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 17px; font-weight: 700;',
      sunsetLabel: '[5:41 PM]',
      shortDate: months[now.getMonth()].slice(0, 3) + ' ' + now.getDate(),
      jazzLists: [0, 1, 2].map((k) => { const n = ((this.state.rot % pages) * 3 + k) % playlists.length; return { name: playlists[n], sub: (n + 1) + ' of ' + playlists.length }; }),
      rotDots: Array.from({ length: pages }, (_, i) => ({ style: 'width: 7px; height: 7px; border-radius: 50%; background: ' + (i === this.state.rot % pages ? '#5CC8DC' : '#5A2117') + ';' })),
      nextLists: () => this.setState({ rot: this.state.rot + 1 }),
      hourDeg: (h * 30).toFixed(2),
      minDeg: (m * 6).toFixed(2),
      clockLabel: 'Analog clock showing ' + hh + ':' + mm,
      dayName: days[now.getDay()],
      dateLabel: months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear(),
      pick: picks[this.state.pickIndex % picks.length],
      pickRecord: () => this.setState({ pickIndex: this.state.pickIndex + 1, spinUntil: Date.now() + 20000 }),
      spinStyle: spinning ? 'animation: spin33 1.8s linear infinite;' : '',
      apps: names.map((n, i) => ({
        name: n,
        style: i === this.state.focus ? tileOn : tile,
        labelStyle: 'font-size: 16px; font-weight: 700; text-align: center; color: ' + (i === this.state.focus ? '#2E1F4A' : 'transparent') + ';',
        dock: 'width: 132px; aspect-ratio: 16 / 9; border-radius: 14px; border: none; color: #2E1F4A; font-family: inherit; font-size: 16px; font-weight: 700; ' + (i === this.state.focus ? 'background: #FFFFFF; outline: 2px solid rgba(217, 69, 143, 0.85); outline-offset: 3px; transform: translateY(-3px) scale(1.04); box-shadow: 0 0 14px rgba(217, 69, 143, 0.18);' : 'background: rgba(255, 255, 255, 0.78);'),
        pick: () => this.setState({ focus: i })
      }))
    };
  }
