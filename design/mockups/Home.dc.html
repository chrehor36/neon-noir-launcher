        name: n,
        style: i === this.state.focus ? tileOn : tile,
        labelStyle: 'font-size: 16px; font-weight: 700; text-align: center; color: ' + (i === this.state.focus ? '#EDE3D0' : 'transparent') + ';',
        dock: 'width: 132px; aspect-ratio: 16 / 9; border-radius: 14px; border: none; color: #EDE3D0; font-family: inherit; font-size: 16px; font-weight: 700; ' + (i === this.state.focus ? 'background: #5A3820; outline: 3px solid #E3A24A; outline-offset: 3px; transform: translateY(-8px) scale(1.1); box-shadow: 0 0 30px rgba(227, 162, 74, 0.45);' : 'background: rgba(62, 38, 20, 0.9);'),
        pick: () => this.setState({ focus: i })
      }))
    };
  }
}
</script>
</body>
</html>
