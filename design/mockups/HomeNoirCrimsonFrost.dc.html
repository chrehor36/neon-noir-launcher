      toggleGlow: () => this.setState({ glow: !this.state.glow }),
      glowStyle: jazz && this.state.glow ? 'animation: beatGlow 0.8s ease-in-out infinite;' : '',
      glowBtn: 'height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid ' + (this.state.glow ? '#FF8C3C' : '#5A2117') + '; background: transparent; color: ' + (this.state.glow ? '#FFB27A' : '#C98B74') + '; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 17px; font-weight: 700;',
      sunsetLabel: '[5:41 PM]',
      shortDate: months[now.getMonth()].slice(0, 3) + ' ' + now.getDate(),
      jazzLists: [0, 1, 2].map((k) => { const n = ((this.state.rot % pages) * 3 + k) % playlists.length; return { name: playlists[n], sub: (n + 1) + ' of ' + playlists.length }; }),
      rotDots: Array.from({ length: pages }, (_, i) => ({ style: 'width: 7px; height: 7px; border-radius: 50%; background: ' + (i === this.state.rot % pages ? '#9C7A3E' : 'rgba(176, 138, 69, 0.2)') + ';' })),
      nextLists: () => this.setState({ rot: this.state.rot + 1 }),
      hourDeg: (h * 30).toFixed(2),
      minDeg: (m * 6).toFixed(2),
      clockLabel: 'Analog clock showing ' + hh + ':' + mm,
      dayName: days[now.getDay()],
      dateLabel: months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear(),
      pick: picks[this.state.pickIndex % picks.length],
      pickRecord: () => this.setState({ pickIndex: this.state.pickIndex + 1, spinUntil: Date.now() + 20000 }),
      spinStyle: spinning ? 'animation: spin33 1.8s linear infinite;' : '',
      apps: names.map((n, i) => ({
        name: n,
        style: i === this.state.focus ? tileOn : tile,
        labelStyle: 'font-size: 16px; font-weight: 700; text-align: center; color: ' + (i === this.state.focus ? '#F3ECE4' : 'transparent') + ';',
        dock: 'width: 132px; aspect-ratio: 16 / 9; border-radius: 3px; border: 1px solid rgba(226, 176, 74, 0.18); text-transform: uppercase; letter-spacing: 0.08em; color: #F3ECE4; font-family: inherit; font-size: 16px; font-weight: 700; ' + (i === this.state.focus ? 'background: #4E1913; outline: 1px solid #E2B04A; outline-offset: 3px; transform: translateY(-3px) scale(1.04); box-shadow: 0 0 22px rgba(226, 176, 74, 0.35), inset 3px 0 0 #8FD8F0;' : 'background: rgba(56, 16, 14, 0.9);'),
        pick: () => this.setState({ focus: i })
      }))
    };
  }
}
</script>
</body>
</html>
